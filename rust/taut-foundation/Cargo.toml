[package]
name = "taut-foundation"
version = "0.12.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Taut no_std + alloc codec, descriptor and explicit validation foundation"
repository = "https://github.com/owebeeone/taut"
readme = "README.md"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "provenance.json"]

[features]
default = []
validation = []
num-bigint = ["dep:num-bigint"]

[dependencies]
num-bigint = { version = "0.4", default-features = false, optional = true }

[lints.rust]
unsafe_code = "forbid"

[workspace]
