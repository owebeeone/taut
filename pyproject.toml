# Distribution name is `taut-proto` (PyPI rejects `taut` as "isn't allowed").
# Import name stays `taut`:  pip install taut-proto  ->  import taut  ->  CLI `taut`.
[project]
name = "taut-proto"
dynamic = ["version"]
description = "taut — one declarative IR -> native types, deterministic CBOR wire, IR-driven codec + service contracts, verified by a golden conformance corpus (import: `taut`)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gianni Mariani", email = "gianni@mariani.ws" }]
keywords = ["idl", "protocol", "schema", "serialization", "cbor", "rpc", "contract"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Networking",
]
dependencies = []   # stdlib only (hand-rolled deterministic CBOR; no runtime deps)

[project.urls]
Homepage = "https://github.com/owebeeone/taut"
Repository = "https://github.com/owebeeone/taut"

[project.scripts]
tautc = "taut.cli:main"   # codegen CLI: `tautc gen IR --out DIR [--lang ...]`

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]   # version from git tags (v0.6.0 -> 0.6.0)
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.10.0"

[tool.setuptools_scm.tag]
prefix = "v"
strict = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["taut*"]

[tool.setuptools.package-data]
# Canonical codec/descriptor/report/engine resources; flat JS and TypeScript
# globs also cover their complete foundation closures (including snapshots).
"taut.gen.runtime" = ["*.rs", "*.hpp", "*.cpp", "*.swift", "*.go", "*.kt", "*.js", "*.java", "go/*.go", "swift/*.swift", "typescript/*.ts", "kotlin/*.kt", "java/taut/validation/*.java", "java/taut/validation/descriptors/*.java"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
markers = [
    "posix: process and symlink semantics exercised on POSIX in the strict release test partition",
    "gate: reruns the parity gate's runners; a release deselects these, since its parity step runs the whole gate with --require-all",
]
