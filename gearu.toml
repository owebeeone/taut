# taut's releases (RELEASE.md). gearu verifies the tree, tags it and pushes the tag, and the GitHub
# Release it creates starts .github/workflows/publish.yml, which publishes taut-proto to PyPI.
[project]
name = "taut"
branch = "main"
remote = "origin"
tag_prefix = "v"
github_repo = "owebeeone/taut"

[python]
manifest = "pyproject.toml"
version = "scm"

[rust]
manifests = ["rust/taut-foundation/Cargo.toml"]

[release]
# scripts/release_checks.py, whose steps run side by side (RELEASE.md). gearu runs `checks` on its
# candidate and `exact_checks` on the commit it tags, which is the same commit here (a tag-derived
# version needs no release commit), so `exact_checks` only rereads the metadata. The tests and
# parity steps fail rather than skip a language, so each toolchain must be installed.
checks = [
    ["uv", "run", "--no-project", "--python", "3.13", "python", "scripts/prepare_release_workspace.py", "{repo}"],
    ["uv", "run", "--no-project", "--python", "3.13", "python", "rust/sync_foundation.py", "--check"],
    ["cargo", "test", "--manifest-path", "rust/taut-foundation/Cargo.toml", "--all-features"],
    ["cargo", "package", "--manifest-path", "rust/taut-foundation/Cargo.toml", "--allow-dirty"],
    ["uv", "run", "--no-project", "--python", "3.13", "--with", "pytest", "--with", "pytest-xdist",
     "--with", "build", "--with", "twine", "--with", "setuptools>=77", "--with", "setuptools-scm>=8",
     "python", "scripts/release_checks.py", "{python_version}"],
]
exact_checks = [
    ["uv", "run", "--no-project", "--python", "3.13", "python", "rust/sync_foundation.py", "--check"],
    ["cargo", "package", "--manifest-path", "rust/taut-foundation/Cargo.toml"],
    ["uv", "run", "--no-project", "--python", "3.13",
     "python", "scripts/release_checks.py", "{python_version}", "--only", "metadata"],
]
github_notes = """taut-proto {python_version}

Immutable descriptors and optional explicit oneof validation now cover all nine
generation targets. Runtime selection is explicit: source, package, or the
legacy supplied-runtime route; generation does not install dependencies.
Invalid drafts remain mutable and serializable. Virtual oneof selection remains
deferred and incomplete. The enum.case accessor preserves metadata-like enum names.

Migration: regenerate schemas and bind every consumer to one compatible nominal
runtime owner. Rust package consumers use the new taut-foundation 0.11 crate;
shape engines remain in their separate libraries. Generated API, ownership,
native ABI and packaging changes are a pre-1.0 minor change; old source/binary
compatibility is not universal. Constrained IR is version 3; readers accept 1..3.

Publishing this GitHub Release triggers the PyPI Trusted Publishing workflow."""
